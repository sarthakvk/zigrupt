<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" role="img" aria-labelledby="title desc">
  <title id="title">Broadcast and backpressure</title>
  <desc id="desc">Producers publish to a fixed-capacity ring. Independent handlers receive the same stream. The slowest handler gates reuse of ring slots.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#334155"/></marker></defs>
  <rect width="820" height="230" rx="12" fill="#f8fafc"/>
  <g fill="#e0f2fe" stroke="#0369a1" stroke-width="2">
    <rect x="20" y="66" width="165" height="66" rx="8"/>
    <rect x="270" y="66" width="225" height="66" rx="8"/>
    <rect x="590" y="20" width="205" height="60" rx="8"/>
    <rect x="590" y="115" width="205" height="60" rx="8"/>
  </g>
  <g fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">
    <text x="102" y="105">Producer(s)</text>
    <text x="382" y="94">Ring buffer</text><text x="382" y="119" font-size="14">fixed capacity</text>
    <text x="692" y="56">Handler A</text><text x="692" y="151">Handler B</text>
    <text x="377" y="211" font-size="16">Slowest handler gates slot reuse</text>
  </g>
  <g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)">
    <path d="M185 99H265"/><path d="M495 88H538V50H585"/>
    <path d="M495 112H538V145H585"/>
    <path d="M695 175V190H382V138" stroke-dasharray="6 4"/>
  </g>
</svg>
