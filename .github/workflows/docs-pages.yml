name: Publish documentation
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: docs-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .docs-site/.node-version
          cache: npm
          cache-dependency-path: .docs-site/package-lock.json
      - run: npm install --global npm@11.16.0
      - run: npm --prefix .docs-site ci
      - run: python3 .docs-site/scripts/build-versions.py
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.141.0
          command: pages deploy .docs-site/dist --project-name=zigrupt --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
