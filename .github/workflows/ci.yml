name: Checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  zig:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Formatting
        run: zig fmt --check build.zig build.zig.zon src test examples
      - name: Existing tests
        run: zig build test --summary all
      - name: Executable examples
        run: zig build check-examples --summary all
      - name: Standalone package consumer
        run: python3 scripts/check-install.py

  docs-changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          # Compare pushes with their previous tip; PRs use their full change list.
          base: ${{ github.ref }}
          # Keep these inputs aligned with docs-pages.yml's push paths.
          filters: |
            docs:
              - 'docs/**'
              - '.docs-site/**'
              - 'src/**'
              - 'build.zig'
              - 'build.zig.zon'
              - 'examples/**'
              - 'README.md'
              - 'CONTRIBUTING.md'
              - 'benchmarks/README.md'
              - '.github/workflows/ci.yml'
              - '.github/workflows/docs-pages.yml'

  docs:
    needs: docs-changes
    if: needs.docs-changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .docs-site/.node-version
          cache: npm
          cache-dependency-path: .docs-site/package-lock.json
      - run: npm install --global npm@11.16.0
      - run: npm --prefix .docs-site ci
      - name: Snippets, production build, and API docs
        run: npm --prefix .docs-site run check
